name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML existence and structure
        run: |
          test -f index.html
          grep -q "<title>" index.html
          echo "HTML structure verified."
